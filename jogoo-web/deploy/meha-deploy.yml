# Copy this file to the repository root as .github/workflows/meha-deploy.yml
#
# Every push to main that touches jogoo-web/ builds the app and publishes:
#   - the website on meha.jogoo.africa
#   - a live update the Android app downloads by itself (no reinstall)
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. premium77.web-hosting.com
#   FTP_USERNAME  an FTP account from cPanel (see jogoo-web/DEPLOY.md)
#   FTP_PASSWORD  its password
name: Meha – publish web app and live update

on:
  push:
    branches: [main]
    paths: ['jogoo-web/**', '.github/workflows/meha-deploy.yml']
  workflow_dispatch:

concurrency:
  group: meha-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jogoo-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jogoo-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build website and live-update bundle
        run: bash scripts/build-release.sh

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publish to the JOGOO hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_WEB_DIR: ${{ vars.FTP_WEB_DIR }}
          FTP_UPDATES_DIR: ${{ vars.FTP_UPDATES_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning title=Not published::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD repository secrets (see jogoo-web/DEPLOY.md) to publish the website and the app update."
            exit 0
          fi
          bash scripts/upload-ftp.sh
